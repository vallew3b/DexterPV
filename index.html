<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DexterPV - Acceso Multi-tenant Premium</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fa-solid fa-layer-group brand-icon" style="color: var(--primary-emerald);"></i> DexterPV
                </div>
                <div class="login-subtitle">Sistema de Control SaaS e Inventario</div>
            </div>

            <!-- Alerta informativa -->
            <div id="loginMessage" style="display:none; padding:12px; border-radius:10px; font-size:13px; margin-bottom:20px; text-align:center; font-weight:600;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario / Correo</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px; padding: 14px;">
                    <i class="fa-solid fa-arrow-right"></i> Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- DB Layer and Auth Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js?v=2"></script>
    <script>
        // Si ya hay sesión activa, redirigir al panel directamente
        if (sessionStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }

        // Auto rellenar credenciales para demos
        function autoFill(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            
            const btn = document.querySelector('button[type="submit"]');
            btn.classList.add('pulse');
            setTimeout(() => {
                btn.click();
            }, 300);
        }

        // Evento de submit de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuarioVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value;
            const messageEl = document.getElementById('loginMessage');
            
            messageEl.style.display = 'none';
            
            try {
                // Autenticar mediante la capa de base de datos
                const result = await window.dexterDB.login(usuarioVal, passwordVal);
                
                if (result.success) {
                    // Guardar sesión del usuario en sessionStorage
                    sessionStorage.setItem('user', JSON.stringify(result.user));
                    
                    messageEl.style.display = 'block';
                    messageEl.style.background = 'var(--emerald-glass)';
                    messageEl.style.color = 'var(--primary-emerald)';
                    messageEl.style.border = '1px solid var(--border-emerald)';
                    messageEl.textContent = '¡Acceso concedido! Redireccionando...';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else {
                    messageEl.style.display = 'block';
                    messageEl.style.background = 'var(--danger-glass)';
                    messageEl.style.color = 'var(--danger)';
                    messageEl.style.border = '1px solid rgba(239, 68, 68, 0.2)';
                    messageEl.textContent = result.error || 'Usuario o contraseña incorrectos.';
                }
            } catch (err) {
                console.error(err);
                messageEl.style.display = 'block';
                messageEl.style.background = 'var(--danger-glass)';
                messageEl.style.color = 'var(--danger)';
                messageEl.style.border = '1px solid rgba(239, 68, 68, 0.2)';
                messageEl.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
